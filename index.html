<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Industry Insight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .category-card { transition: all 0.3s ease; border-left: 4px solid transparent; }
        .category-card:hover { transform: translateY(-2px); border-left-color: #3b82f6; }
        .news-btn { @apply flex items-center justify-between w-full p-4 mb-3 bg-white rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all; }
        .icon-box { @apply w-10 h-10 rounded-lg flex items-center justify-center mr-4 text-white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Intelligence Desk <span class="text-blue-600">2026</span></h1>
            <p class="text-slate-500 font-medium">실시간 산업동향 및 투자 뉴스 스캐너</p>
        </header>

        <section class="mb-10">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center">
                <span class="w-8 h-[1px] bg-slate-300 mr-2"></span> Stock & Economy
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button onclick="searchNews('국내 증시 시황')" class="news-btn">
                    <div class="flex items-center">
                        <div class="icon-box bg-blue-600">📈</div>
                        <div class="text-left"><p class="font-bold text-sm">국내 증시 시황</p><p class="text-[11px] text-slate-400">코스피, 코스닥 동향</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
                <button onclick="searchNews('반도체 산업 전망')" class="news-btn">
                    <div class="flex items-center">
                        <div class="icon-box bg-slate-800">💾</div>
                        <div class="text-left"><p class="font-bold text-sm">반도체/AI 산업</p><p class="text-[11px] text-slate-400">엔비디아, 삼성전자, SK하이닉스</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
                <button onclick="searchNews('미국 증시 나스닥')" class="news-btn">
                    <div class="flex items-center">
                        <div class="icon-box bg-emerald-600">💵</div>
                        <div class="text-left"><p class="font-bold text-sm">해외 증시 (뉴욕)</p><p class="text-[11px] text-slate-400">나스닥, S&P 500 리포트</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
                <button onclick="searchNews('금리 인플레이션 전망')" class="news-btn">
                    <div class="flex items-center">
                        <div class="icon-box bg-amber-600">📊</div>
                        <div class="text-left"><p class="font-bold text-sm">거시 경제</p><p class="text-[11px] text-slate-400">금리, 환율, 인플레이션</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
            </div>
        </section>

        <section class="mb-10">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center">
                <span class="w-8 h-[1px] bg-slate-300 mr-2"></span> Cosmetics & Beauty Biz
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button onclick="searchNews('화장품 정책 규제')" class="news-btn border-l-4 border-l-rose-400">
                    <div class="flex items-center">
                        <div class="icon-box bg-rose-500">⚖️</div>
                        <div class="text-left"><p class="font-bold text-sm">화장품 정책/규제</p><p class="text-[11px] text-slate-400">식약처 고시, 성분 규제 정보</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
                <button onclick="searchNews('뷰티 신제품 출시')" class="news-btn border-l-4 border-l-rose-400">
                    <div class="flex items-center">
                        <div class="icon-box bg-rose-400">✨</div>
                        <div class="text-left"><p class="font-bold text-sm">신제품 & 트렌드</p><p class="text-[11px] text-slate-400">K-뷰티 신제품, 신기술 소식</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
                <button onclick="searchNews('화장품 마케팅 전략')" class="news-btn border-l-4 border-l-rose-400">
                    <div class="flex items-center">
                        <div class="icon-box bg-rose-600">📱</div>
                        <div class="text-left"><p class="font-bold text-sm">마케팅/유통</p><p class="text-[11px] text-slate-400">올리브영, 이커머스, 마케팅 전략</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
                <button onclick="searchNews('Global Beauty Industry Market')" class="news-btn border-l-4 border-l-rose-400">
                    <div class="flex items-center">
                        <div class="icon-box bg-slate-700">🌍</div>
                        <div class="text-left"><p class="font-bold text-sm">Global Beauty</p><p class="text-[11px] text-slate-400">해외 시장 동향 (L'Oreal, Estee Lauder)</p></div>
                    </div>
                    <span class="text-slate-300">➔</span>
                </button>
            </div>
        </section>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-sm font-bold mb-3">Custom Search</h3>
            <div class="flex gap-2">
                <input type="text" id="custom-query" placeholder="기업명이나 키워드 입력..." class="flex-1 bg-slate-100 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-400 text-sm">
                <button onclick="searchNews(document.getElementById('custom-query').value)" class="bg-slate-900 text-white px-6 py-2 rounded-xl font-bold text-sm">검색</button>
            </div>
        </div>
    </div>

    <script>
        function searchNews(query) {
            if(!query) return;
            // 구글 뉴스 실시간 검색 결과로 연결 (최신순 정렬 설정 포함 가능)
            const url = `https://www.google.com/search?q=${encodeURIComponent(query)}&tbm=nws&tbs=qdr:d`; // qdr:d 는 지난 24시간 내 기사만 보기
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
